<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="player-choice">
      <button class="player js-rock-button">
        <img src="Assets/rock.png" class="game-move">
      </button>

      <button class="player" >
        <img src="Assets/paper.png" class="game-move js-paper-button">
      </button>

      <button class="player">
        <img src="Assets/scissors.png" class="game-move js-scissors-button">
      </button>
    </div>

    <p class="js-result result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>

    <button class="game-reset js-game-reset">Reset</button>

    <button class="auto-play-button js-autoplay">
      Autoplay
    </button>

    <p class="reset-confirm js-reset-confirmation"></p>
    <script src="script.js"></script>
  </body>
</html>
