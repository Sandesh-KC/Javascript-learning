<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="player-choice">
    <button class="player" onclick="
      playGame ('Rock');
    "><img src="Assets/rock.png" class="game-move"></button>

    <button class="player" onclick="
      playGame ('Paper');
    "><img src="Assets/paper.png" class="game-move"></button>

    <button class="player" onclick="
      playGame ('Scissors');
    "><img src="Assets/scissors.png" class="game-move"></button>
    </div>

    <p class="js-result result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>

    <button class="game-reset" onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement ();
    ">Reset</button>

    <button class="auto-play-button"
    onclick="
      autoPlay();

    ">Autoplay</button>

    <script src="script.js">
      
    </script>
  </body>
</html>
