<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rps.css">
</head>
<body>
  <div class="game-container">
      <h1>🎮 Rock Paper Scissors 🎮</h1>
      
      <div class="controls-info">
          💡 Use keyboard: R (Rock) • P (Paper) • S (Scissors) • A (Autoplay) • Backspace (Reset)
      </div>

      <div class="player-choice">
          <button class="player js-rock-button">
              <img src="../RockPaperScissors/Assets/rock.png" class="game-move" alt="Rock">
          </button>
          <button class="player js-paper-button">
              <img src="../RockPaperScissors/Assets/paper.png" class="game-move" alt="Paper">
          </button>
          <button class="player js-scissors-button">
              <img src="../RockPaperScissors/Assets/scissors.png" class="game-move" alt="Scissors">
          </button>
      </div>

      <div class="results-section">
          <p class="js-result result"></p>
          <p class="js-move"></p>
          <p class="js-score"></p>
      </div>

      <div class="button-controls">
          <button class="auto-play-button js-autoplay">Autoplay</button>
          <button class="game-reset js-game-reset">Reset Score</button>
      </div>

      <p class="reset-confirm js-reset-confirmation"></p>
    </div>
    <script src="rps.js"></script>
</body>
</html>
