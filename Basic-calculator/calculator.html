<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=], initial-scale=1.0">
  <title>Calculator</title>
  <style>
    h1{
      font-weight: bold;
      text-align: center;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body{
      background-color: black;
    }
    button{
      height: 50px;
      width: 50px;
      border-radius: 100%;
      background-color: orange;
      color: white;
      font-weight: bold;
      border: white;
      font-size: 1rem;
    }
    #main{
      text-align: center;
    }
    #result{
      margin: 0 auto;
      display: flex;
      color: black;
      font-weight: bold;
      font-size: 1.4rem;
      height: 50px;
      background-color: aliceblue;
      width: 200px;
      justify-content: center;
      align-items: center;
      border-radius: 5%;
    }
    button:hover{
      background-color: darkgoldenrod;
    }

  </style>
</head>
<body>
  <h1>Sandesh calculator</h1>

  <div id="result"></div>
  <br>

  <div id="main">
    <button onclick="updateCalculation (1);">1</button>
    <button onclick="updateCalculation (2);" >2</button>
    <button onclick="updateCalculation (3);">3</button>
    <button onclick="updateCalculation ('+')">+</button>
    <br>
    <br>
    <button onclick="updateCalculation (4);">4</button>
    <button onclick="updateCalculation (5);">5</button>
    <button onclick="updateCalculation (6);">6</button>
    <button onclick="updateCalculation ('-');">-</button>
    <br>
    <br>
    <button onclick="updateCalculation (7);">7</button>
    <button onclick="updateCalculation (8);">8</button>
    <button onclick="updateCalculation (9);">9</button>
    <button onclick="updateCalculation ('*');">*</button>
    <br>
    <br>
    <button onclick="updateCalculation (0);">0</button>
    <button onclick="updateCalculation ('.');">.</button>
    <button onclick="updateCalculation ('/');">/</button>
    <button onclick="calculation = eval(calculation); document.getElementById('result').innerText = calculation;">=</button>
    <br> <br> <br>
    <button onclick="calculation=''; document.getElementById('result').innerText = '';">Clear</button>
  </div>
  
  <script>
    let calculation = '';
    function updateCalculation (value) {
      calculation += value; document.getElementById('result').innerText = calculation;
    }
  </script>
</body>
</html>
